markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      # Keep CJK heading anchors (GitHub-style), so `#中文标题` links resolve on the site too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - fenced_code
  - codehilite

plugins:
  - search

strict: true

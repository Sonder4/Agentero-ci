      - "macOS 新建窗口崩溃（AppKit 主线程断言，⌘N 打不开新窗口）": bug_fix/macos-second-window-appkit-crash.md
      - PDF 引用跳转后被拉回第 1 页: bug_fix/pdf-citation-page-restore-race.md
      - "Windows PDF 翻页随机跳到首尾页（#539）": bug_fix/pdf-windows-scroll-endpoint-jump.md
      - Pi ACP 未使用 Vault 工作目录: bug_fix/pi-acp-vault-cwd.md
      - 左侧文件树偶发黑屏: bug_fix/vault-sidebar-blank-until-scroll.md
      - Cargo 构建脚本读取了旧 worktree 路径: bug_fix/cargo-build-script-stale-worktree-path.md
      - 开启网络代理后 OpenCode 模型列表为空: bug_fix/opencode-proxy-loopback-models.md
      - PDF 批注导入因日期字符串失败: bug_fix/pdf-annotation-import-dates.md
      - PDF 异步打开与卸载重叠时的文档泄漏: bug_fix/pdf-inflight-document-leak.md
      - 版面分析切换论文时报 invalid session id: bug_fix/pdf-layout-shared-onnx-session.md
      - 重复原生链接导致 PDF 首屏停顿: bug_fix/pdf-native-link-duplicates.md
      - PDF 旋转页显示为未旋转页框: bug_fix/pdf-rotated-page-shell.md
      - PDF 页面阴影与 WebKitGTK 滚动停顿: bug_fix/pdf-webkit-page-shadow.md
      - "侧栏收起后无法再调整宽度（#1163）": bug_fix/rail-separator-unmount.md
      - 同一笔记的两个分屏互相覆盖: bug_fix/split-pane-markdown-save.md
      - 全文译文划选选错范围: bug_fix/translation-selection-link-preview.md
      - 坚果云 WebDAV 根地址 PUT 404: bug_fix/webdav-jianguoyun-root-404.md
      - Windows ACP 孤儿进程累积: bug_fix/windows-acp-orphan-processes.md
      - Windows 内置 ACP 适配器在初始化前退出: bug_fix/windows-bundled-acp-node-path.md
      - Windows 内置 Claude ACP 的 spawn EINVAL: bug_fix/windows-claude-bundled-spawn-einval.md
      - Windows Dsh 静默退出与 npm 卸载目录不匹配: bug_fix/windows-dsh-runtime-and-uninstall.md
      - Windows 触控板无法捏合缩放论文: bug_fix/windows-pdf-touchpad-pinch.md
      - Windows 技能链接、并发写和远程目录删除失败: bug_fix/windows-symlink-replace-and-catalog-handle.md

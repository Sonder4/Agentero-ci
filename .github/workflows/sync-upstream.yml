name: Sync upstream

# Keeps this non-fork mirror current with poco-ai/Agentero. Runs daily and on
# demand. When upstream has new commits, it merges them into a sync branch and
# opens a pull request so CI validates the update before main moves.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into a pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/poco-ai/Agentero.git
          git fetch upstream main

      - name: Check whether upstream is already merged
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "upstream is already merged; nothing to sync"
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into the sync branch
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          git checkout -B sync/upstream
          git merge --no-edit upstream/main

      - name: Push sync branch
        if: steps.check.outputs.needs_sync == 'true'
        run: git push --force origin sync/upstream

      - name: Open or update the sync pull request
        if: steps.check.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head sync/upstream --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing sync PR #$existing"
            exit 0
          fi
          gh pr create \
            --head sync/upstream \
            --base main \
            --title "chore: sync upstream main" \
            --body "Automated merge of [poco-ai/Agentero](https://github.com/poco-ai/Agentero) main. CI runs on this PR; merge once it is green."

